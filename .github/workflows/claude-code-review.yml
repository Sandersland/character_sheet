name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Cancel an in-flight review when new commits are pushed to the same PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # Skips drafts, forks and staging->main promotes. Must stay job-level: a
    # skipped job satisfies the required check, a workflow filter never reports.
    timeout-minutes: 20
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !(github.event.pull_request.head.ref == 'staging' && github.event.pull_request.base.ref == 'main')
    permissions:
      contents: read
      pull-requests: write # Required to post inline review comments + tracking comment
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Logic lives in .github/claude-review/: the action skips any PR that edits this file.
      - name: Prepare review scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
        run: .github/claude-review/prepare-scope.sh

      # enforce-verdict.sh only counts reviews after this instant.
      - name: Mark review start
        id: marker
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Single reviewer, not the multi-agent plugin, which took 20-30 min (#1995).
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: >-
            --model claude-sonnet-5-5
            --allowed-tools "Bash(gh:*)" "Read" "Grep" "Glob" "mcp__github_inline_comment__create_inline_comment"
          prompt: ${{ steps.scope.outputs.prompt }}

      - name: Enforce verdict
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MARKER: ${{ steps.marker.outputs.ts }}
        run: .github/claude-review/enforce-verdict.sh

      # A skipped run never re-checked them, so they aren't stale.
      - name: Dismiss stale bot change-request
        if: success() && steps.verdict.outputs.reviewed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: .github/claude-review/dismiss-stale.sh

      - name: Flag a run that did not review
        if: success() && steps.verdict.outputs.reviewed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: .github/claude-review/notify-not-reviewed.sh
