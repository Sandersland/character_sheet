name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Cancel an in-flight review when new commits are pushed to the same PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # Skip draft PRs, fork PRs (forks can't access repo secrets), and the
    # staging->main promote PR — every line in a promote was already reviewed on
    # its feature PR, so re-reviewing the aggregate is pure latency. This skip
    # must stay JOB-level: a skipped job still reports a "skipped" conclusion,
    # which satisfies main's required claude-review check; a workflow-level
    # filter would report nothing and block the promote's auto-merge forever.
    timeout-minutes: 20
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !(github.event.pull_request.head.ref == 'staging' && github.event.pull_request.base.ref == 'main')
    permissions:
      contents: read
      pull-requests: write # Required to post inline review comments + tracking comment
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # The prompt and every script live in .github/claude-review/, not inline:
      # the action skips itself on any PR that edits THIS file (it must match
      # the default branch), so keeping it to wiring means prompt and logic
      # changes still get reviewed on their own PR.
      - name: Prepare review scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_ACTION: ${{ github.event.action }}
        run: .github/claude-review/prepare-scope.sh

      # enforce-verdict.sh only counts reviews submitted after this instant, so a
      # stale CHANGES_REQUESTED from an earlier run (or a human) can't fail or
      # pass the check on its own.
      - name: Mark review start
        id: marker
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # One focused reviewer instead of the multi-agent code-review plugin (#1995):
      # the plugin's sequential stages (gate -> summary -> 4 parallel reviewers ->
      # one validator per finding), each re-reading CLAUDE.md, took 20-30 min per
      # non-trivial PR. The prompt's self-verification rule stands in for the
      # plugin's separate validator stage, and its INVESTIGATE step is mandatory:
      # without it the reviewer read only the diff and returned "No issues" on a
      # 554-line PR in 6 turns.
      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: >-
            --model claude-sonnet-5-5
            --allowed-tools "Bash(gh:*)" "Read" "Grep" "Glob" "mcp__github_inline_comment__create_inline_comment"
          prompt: ${{ steps.scope.outputs.prompt }}

      # Applies to BOTH base branches so main gets a red check too.
      - name: Enforce verdict
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MARKER: ${{ steps.marker.outputs.ts }}
        run: .github/claude-review/enforce-verdict.sh

      # Only after a run that actually reviewed: when the action skipped itself,
      # an earlier change-request was never re-checked, so it is not stale.
      - name: Dismiss stale bot change-request
        if: success() && steps.verdict.outputs.reviewed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: .github/claude-review/dismiss-stale.sh

      - name: Flag a run that did not review
        if: success() && steps.verdict.outputs.reviewed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: .github/claude-review/notify-not-reviewed.sh
