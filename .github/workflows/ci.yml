name: CI

# push:staging matters because staging's protection is non-strict (branches
# needn't be up to date to merge): two independently-green PRs can combine
# badly, and this post-merge run is what surfaces that within minutes.
on:
  pull_request:
  push:
    branches: [main, staging]

# Cancel superseded runs on the same ref so redundant pushes don't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # Migration-shape gate (#1373): an enum-narrowing migration whose USING
      # cast aborts on populated rows leaves the DB in P3009, which blocks every
      # migration behind it. Deliberately in `lint`, not the `fallow` job where
      # the other grep gates live: `fallow` needs: test-backend, so this 10ms sh gate
      # would otherwise wait on Postgres + vitest + coverage. Needs no node, so
      # it runs before dependency setup. Twin of the lefthook pre-commit job.
      - name: enum-narrowing migrations guarded
        run: sh scripts/check-enum-narrowing.sh

      # Subclass identity must resolve via resolveSubclassSlug, never a
      # substring match on the freeform display name (#1277). Needs no node,
      # so it runs before dependency setup alongside the enum-narrowing gate. Twin of
      # the lefthook pre-commit job.
      - name: subclass identity resolved via slug, not substring
        run: sh scripts/check-subclass-substring.sh

      # An edition rule must branch as a total mapping over RulesEdition,
      # never a binary `edition === "EDITION_…"` comparison (#1978,
      # generalizing #1527's subclassGateLevel pattern to every rule fn).
      # Needs no node, so it runs alongside the other grep gates above. Twin
      # of the lefthook pre-commit job.
      - name: edition rules branch as a total mapping, not ===/!==
        run: sh scripts/check-edition-branching.sh

      # Boot-contract gate (#1277 defect 3): needs no node, runs alongside
      # the other grep gates above. Twin of the lefthook pre-commit job.
      - name: every migrate-deploy boot command also seeds
        run: sh scripts/check-seed-required.sh

      # AC-4 machine enforcement (#1277): a seed DATA module must carry no
      # prisma/upsert/await token. Needs no node. Twin of the lefthook
      # pre-commit job.
      - name: seed data modules contain no upsert logic
        run: sh scripts/check-seed-data-modules.sh

      # Every client-supplied catalog id (Feat/Subclass/GrantedAbility/
      # Background/Action) must resolve through crossEditionRejection or be on
      # the declared exemption list (#1345). Needs no node, so it runs
      # alongside the other grep gates above. Twin of the lefthook pre-commit job.
      - name: catalog ids resolved with the cross-edition guard
        run: sh scripts/check-catalog-id-edition-guard.sh

      # A MIGRATED class (#1522/#1134 — retabled from lib/classes/<class>.ts
      # onto seeded ClassFeature rows, Fighter first per #1532) must never
      # reappear as class-specific TS elsewhere. Needs no node, so it runs
      # alongside the other grep gates above. Twin of the lefthook pre-commit job.
      - name: migrated classes stay out of class-specific TS
        run: sh scripts/check-class-ts-migration.sh

      - uses: ./.github/actions/setup-deps

      - run: npm run lint

  fallow:
    # Server-side twin of the lefthook pre-commit fallow gate (#691) — two gates
    # in one job:
    #   1. AUDIT (PR-only step): audits the PR diff for NEW dead code /
    #      complexity / duplication against the PR base. The enforcement layer —
    #      a locally bypassed hook (--no-verify) gets re-checked here, so
    #      adjudicated exceptions must be inline `fallow-ignore-next-line`
    #      suppressions, visible in the diff. Needs a base to diff against, so
    #      the step runs on PR events only and is skipped on the staging->main
    #      promote PR (every line in a promote was already audited on its
    #      feature PR).
    #   2. HEALTH (every event): the repo-wide zero-CRITICAL ratchet (#702).
    #      Runs on pushes to main/staging too, so a direct push can't slip a
    #      CRITICAL past the gate the way a PR-only job would.
    #
    # Fork PRs skip the WHOLE job at job level: a skipped job still reports a
    # "skipped" conclusion, which satisfies the required check (a workflow-level
    # filter would block merges instead).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `needs: test-backend` so the backend health step can consume the vitest
    # coverage the test-backend shards upload (#717): fallow reads Istanbul
    # coverage for exact CRAP, and the coverage-producing run needs Postgres,
    # which lives in test-backend. The trade is that fallow's fast gates now wait
    # on test-backend — acceptable for an accurate hot-path-risk bar.
    needs: test-backend
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: `fallow audit --base` needs the base branch and the
          # merge-base commits, which the default shallow clone doesn't have.
          fetch-depth: 0

      - uses: ./.github/actions/setup-deps

      # The backend's `@/generated/prisma/*` client is gitignored, so without this
      # step fallow can't resolve those imports and flags every NEW file that
      # imports the client as an "unresolved import" (inherited ones are excluded
      # by the new-only gate, so this only bites files a PR adds). Generating the
      # client — as the build job does — makes fallow's import graph accurate.
      # prisma.config.ts validates DATABASE_URL even for `generate` (never
      # connects), so a dummy URL satisfies it without a Postgres.
      - name: Prisma generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
        run: npx prisma generate

      # PR-only + skip the staging->main promote PR. Guarding on the PR event
      # here (rather than at job level) lets the health step below run on push
      # events too. --no-install forces the locally-pinned binary (never a
      # registry fallback), matching the lefthook hook's node_modules/.bin/fallow.
      - name: fallow audit (new findings vs PR base)
        if: >-
          github.event_name == 'pull_request' &&
          !(github.event.pull_request.head.ref == 'staging' && github.event.pull_request.base.ref == 'main')
        run: npx --no-install fallow audit --base "origin/${{ github.event.pull_request.base.ref }}" --gate new-only --no-cache

      # fallow twin of eslint's require-description gate (#1045): every
      # `fallow-ignore-next-line` must carry a `-- <reason>`. Server-side twin of
      # the lefthook `fallow-reasons` job, so a `--no-verify` push is re-checked.
      # Runs on every event (whole tree), not just PRs.
      - name: fallow-ignore reasons required
        run: sh scripts/check-fallow-reasons.sh

      # Banner twin of the reasons gate (#1057): no lint rule detects section
      # dividers, so this grep enforces the CLAUDE.md banner ban in frontend/src.
      # Server-side twin of the lefthook `comment-banners` job. Every event.
      - name: section banners forbidden
        run: sh scripts/check-comment-banners.sh

      # Repo-wide zero-dead-code gate: the audit step above is new-only on the
      # PR diff, so an export orphaned by deleting its last importer ELSEWHERE
      # never trips it (the export's own lines didn't change). The tree was
      # cleaned to zero when this gate landed; this holds it there. Needs the
      # generated Prisma client (step above) to resolve `@/generated` imports.
      - name: fallow dead-code (repo-wide zero)
        run: npx --no-install fallow dead-code --no-cache

      # The repo-wide ratchet, expressed PER-WORKSPACE so each workspace's CRAP
      # treatment can differ (#718, tightened from the old repo-wide
      # `--min-severity critical` step). Together the frontend step here and the
      # backend step below leave no HIGH/CRITICAL-severity function anywhere —
      # the "critical->high" flip #692 aimed for. Both run on every event (incl.
      # pushes to main/staging), so a direct push is gated too.
      #
      # FRONTEND: complexity-ceiling gate. --max-crap 999 drops the CRAP axis, so
      # severity is driven purely by the cyclomatic/cognitive ceilings. Frontend
      # vitest coverage is deliberately NOT wired in here: at ~69% coverage real
      # CRAP would flag coverage debt, not complexity, exploding the tier to ~39
      # findings. Enforcing frontend CRAP once coverage is raised is a tracked
      # future issue (the frontend twin of #717). --production excludes
      # test/e2e/story files (their complexity isn't gated).
      - name: fallow health (no HIGH-complexity findings in frontend)
        run: npx --no-install fallow health -w frontend --production --min-severity high --max-crap 999 --no-cache

      # #692 backend tightening. Plain mode = fails on ANY finding in scope, so
      # this enforces the coverage-INDEPENDENT thresholds (cyclomatic <=20 AND
      # cognitive <=15) in every backend PRODUCTION function — stricter than the
      # `audit --gate new-only` step above, which only inspects the PR diff (a
      # refactor that pushes an EXISTING function over the bar is caught here too).
      #   --production  excludes test/story files (test complexity isn't gated)
      #   --coverage    feeds fallow the vitest Istanbul coverage test-backend
      #     produced, so CRAP is exact (untested complexity → real high CRAP)
      #     instead of the export-reference estimate that inflated under
      #     --production (#717).
      #   --max-cyclomatic 16 / --max-crap 25  ratchet BELOW the .fallowrc.jsonc
      #     bars (20/30). CLI-only because the config bars are shared with the
      #     frontend, which can't absorb them. Cognitive stays at the config's
      #     15. CRAP 25 (not 20) because an UNCOVERED function floors at
      #     CC²+CC, which would ban untested cyc-4 helpers at 20; 25 still bans
      #     untested cyc≥5. A new backend function in the 16–20 cyclomatic band
      #     passes the local pre-commit audit (config bars) and fails only
      #     here — required check, so it still can't merge.
      # The shards ran on runners with the same $GITHUB_WORKSPACE absolute paths,
      # so no --coverage-root remap is needed. Plain mode (no --min-severity) is
      # stricter than the frontend step's `high` bar: it fails on ANY backend
      # production finding.
      - name: Download backend test shard reports (from test-backend)
        uses: actions/download-artifact@v4
        with:
          pattern: backend-blob-*
          path: backend/.vitest-reports
          merge-multiple: true

      # Rebuilds one coverage-final.json from the shards' blob reports. Reads
      # the blobs only — runs no tests and needs no Postgres.
      - name: Merge backend coverage
        working-directory: backend
        run: npx vitest --merge-reports --coverage --reporter=dot

      - name: "fallow health (backend production: real CRAP via vitest coverage)"
        run: npx --no-install fallow health -w backend --production --coverage backend/coverage/coverage-final.json --max-cyclomatic 16 --max-crap 25 --no-cache

  build:
    # Production type-check + bundle. vitest transpiles via esbuild and does NOT
    # type-check, so type-only errors slip past `test`/`lint` and only surface in
    # the `tsc` build Railway runs. This job is that gate. No Postgres needed —
    # it only type-checks and bundles; `prisma generate` provides the client
    # types the backend `tsc` imports.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-deps

      - name: Prisma generate
        working-directory: backend
        # prisma.config.ts validates DATABASE_URL at load even for `generate`,
        # which never connects — a dummy URL satisfies it without a Postgres.
        env:
          DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
        run: npx prisma generate

      - run: npm run build

      # `npm run build` (tsc && tsc-alias) never type-checks prisma/seed/*.ts —
      # backend/tsconfig.json's `include` is src-only. This is the CI leg of
      # backend's `typecheck` script (tsconfig.seed.json, #1277), which also
      # type-checks src again — harmless, tsc is fast and idempotent here.
      - name: Backend typecheck (incl. prisma/seed)
        run: npm run typecheck --workspace backend

      # `npm run build` (tsc && vite build) never type-checks frontend/e2e/**
      # — frontend/tsconfig.json's `include` is src-only, and Playwright
      # transpiles those files without type-checking (#1482). This is the CI
      # leg of frontend's `typecheck` script (tsconfig.e2e.json), which also
      # type-checks src again — harmless, tsc is fast and idempotent here.
      - name: Frontend typecheck (incl. e2e)
        run: npm run typecheck --workspace frontend

      # zod is a real backend/contracts dependency, but the frontend must only
      # ever `import type` from @character-sheet/contracts — a stray value
      # import would ship zod's runtime to every player (#1370). Runs right
      # after `npm run build` so it inspects the actual frontend/dist this job
      # just produced, not a separate build.
      - name: zod absent from client bundle
        run: sh scripts/check-no-zod-in-client-bundle.sh

  docker-build:
    # Proves the root Dockerfile — the image Railway deploys — still assembles
    # (#1454). `build` above type-checks and bundles on the runner's own tree,
    # which never exercises the three-stage COPY chain, the workspace links, or
    # .dockerignore — a stage rename, a moved COPY or a dropped context path
    # would otherwise surface at DEPLOY time, against the real database.
    # Deliberately absent from every job's `needs:` — it duplicates no other
    # gate, so it runs alongside them rather than extending the critical path.
    #
    # This job is also the only thing that ever executes stage 2's contracts
    # barrel load assertion (#1370), which fails the build below 12 *Schema
    # exports. It prints `contracts: N schemas loaded` whenever that layer is
    # cold, which is exactly when packages/ or the root manifests changed — the
    # only way a barrel regression can enter. A run whose layers all hit the
    # cache logs CACHED instead, and that is not a gap.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # The default docker driver cannot export to a remote cache at all;
      # buildx's container driver is what makes cache-to below work.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          # Repo root, never a subdirectory: `npm ci --workspace` has to link
          # packages/* (#820), so a narrower context can't resolve the install.
          context: .
          file: Dockerfile
          # Proving the image assembles is the whole win here. Railway builds
          # from the repo itself, so there is nothing to publish to; wiring a
          # registry is a separate decision.
          push: false
          # mode=max also caches the frontend + backend stages. Under the default
          # mode=min only the final stage's layers survive, and that stage is
          # three COPY lines — every npm ci, vite build and tsc would rerun in
          # full on every PR.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Sharded across runners: one runner spent ~6 minutes here, most of it
  # importing modules per test file rather than running tests. Each shard builds
  # its own template database, so the shard count also multiplies that ~25s
  # setup. fail-fast off so one red shard doesn't hide another's failures.
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        # Keep this in sync with the image in docker-compose.yml
        image: postgres:17-alpine
        env:
          POSTGRES_USER: character_sheet
          POSTGRES_PASSWORD: character_sheet
          POSTGRES_DB: character_sheet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U character_sheet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://character_sheet:character_sheet@localhost:5432/character_sheet

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-deps

      # No migrate/seed here: vitest's global setup migrates and seeds its own
      # template database and clones one per worker (#1269), so the job-level
      # DATABASE_URL only donates the host, credentials and base name. The e2e
      # job still prepares the main database — it runs a real stack.
      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate

      # An S3-compatible server backs the s3 blob-store contract leg (#1614): the
      # S3_TEST_* env below un-skips it, so "same contract suite passes against
      # both drivers" is CI-enforced and createS3BlobStore has real coverage for
      # the fallow CRAP gate. SeaweedFS, because MinIO withdrew its public images
      # (minio/minio and quay.io/minio/minio no longer pull). A `services:` block
      # can't override an image's command — hence docker run, not a service.
      - name: Start SeaweedFS S3 (s3 blob-store contract leg)
        run: docker run --rm -d --name s3 -p 8333:8333 chrislusf/seaweedfs:4.53 server -s3

      - name: Wait for SeaweedFS S3
        run: .github/scripts/wait-for-urls.sh 30 http://localhost:8333/healthz || { docker logs s3; exit 1; }

      # Backend runs WITH coverage so the fallow job can gate real CRAP (#717);
      # test:coverage IS the backend `vitest run` plus Istanbul instrumentation
      # (no double run). The blob reporter carries this shard's coverage to the
      # fallow job, which merges the shards.
      - name: Backend tests (with coverage for the fallow CRAP gate)
        env:
          S3_TEST_ENDPOINT: http://localhost:8333
          S3_TEST_BUCKET: test-bucket
          S3_TEST_ACCESS_KEY_ID: minioadmin
          S3_TEST_SECRET_ACCESS_KEY: minioadmin
        run: npm run test:coverage --workspace backend -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=default --reporter=blob

      - name: Upload backend shard report
        uses: actions/upload-artifact@v4
        with:
          name: backend-blob-${{ matrix.shard }}
          path: backend/.vitest-reports/
          retention-days: 1
          # Fail loudly here if vitest didn't write its blob, rather than letting
          # the fallow job's merge fail with a confusing missing-shard error.
          if-no-files-found: error

  # Split from test-backend (#1997) so the two suites run side by side instead
  # of back to back. Needs no Postgres, S3 or Prisma client.
  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-deps

      - run: npm test --workspace frontend

  # Branch protection requires a check named `test`; this job keeps that name
  # alive over the test-backend/test-frontend split (#1997). `always()` makes it
  # report a real failure when a half fails instead of being skipped — a skipped
  # required check would let the PR merge.
  test:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Both test halves passed
        run: |
          [ "${{ needs.test-backend.result }}" = success ] && [ "${{ needs.test-frontend.result }}" = success ] \
            || { echo "test-backend=${{ needs.test-backend.result }} test-frontend=${{ needs.test-frontend.result }}"; exit 1; }

  e2e:
    # Playwright smoke suite against a booted dev stack (same postgres service as
    # `test-backend`, plus the backend + Vite dev servers the e2e harness proxies through).
    # Runs on every PR and reports status, but is NOT a required status check
    # (branch protection lists claude-review/lint/test/build/fallow only) — a red
    # run here does not block merge, so watch it manually on UI-layout changes.
    # Runs SERIALLY (playwright.config.ts sets workers: 1) — the specs share one
    # dev stack and a campaign allows only one active session, so parallel
    # workers overload the stack; don't reintroduce --workers here.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # Keep this in sync with the image in docker-compose.yml
        image: postgres:17-alpine
        env:
          POSTGRES_USER: character_sheet
          POSTGRES_PASSWORD: character_sheet
          POSTGRES_DB: character_sheet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U character_sheet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://character_sheet:character_sheet@localhost:5432/character_sheet

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-deps

      - name: Prisma generate / migrate / seed
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed

      - name: Playwright version
        id: pw
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The browser download is cacheable; its apt system deps are not (they live
      # outside the cached dir), so a cache hit still runs install-deps (#2001).
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Start backend
        # ALLOW_DEV_LOGIN powers the e2e harness's passwordless session mint; PORT
        # matches the Vite proxy target below. Backgrounded — survives to later steps.
        env:
          PORT: "4000"
          ALLOW_DEV_LOGIN: "true"
          RATE_LIMIT_DISABLED: "true"
        run: nohup npm run dev --workspace backend > /tmp/backend.log 2>&1 &

      - name: Build frontend
        # e2e runs against the production build (served by `vite preview`), NOT the
        # dev server — pre-compiled assets render fast + deterministically, so no
        # on-demand compilation slows first renders and times out specs.
        # VITE_API_URL is inlined at build time and keeps the SPA same-origin.
        working-directory: frontend
        env:
          VITE_API_URL: /api
        run: npm run build

      - name: Start frontend (preview)
        # `vite preview` serves the built dist/ on :5173 with the same /api proxy
        # (vite.config.ts `preview.proxy`), so the session cookie stays first-party.
        env:
          VITE_PROXY_TARGET: http://localhost:4000
        run: nohup npm run preview --workspace frontend -- --port 5173 > /tmp/frontend.log 2>&1 &

      - name: Wait for stack
        run: .github/scripts/wait-for-urls.sh 60 http://localhost:4000/api/health http://localhost:5173 -- /tmp/backend.log /tmp/frontend.log

      - name: Run Playwright
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5173
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            /tmp/backend.log
            /tmp/frontend.log
          retention-days: 7
