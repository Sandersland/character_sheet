version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades go through a ticket, not the weekly batch.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Must move together with the Playwright image tag in docker-compose.yml (#2041).
      - dependency-name: "@playwright/test"
      # Held at the version @react-three/fiber 8 supports until the React 19 upgrade (#2039).
      - dependency-name: "three"
      - dependency-name: "@types/three"
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    ignore:
      # A Postgres or Node major has to match what Railway runs.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Must move together with @playwright/test (#2041).
      - dependency-name: "mcr.microsoft.com/playwright"
