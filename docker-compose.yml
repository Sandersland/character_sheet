services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-character_sheet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-character_sheet}
      POSTGRES_DB: ${POSTGRES_DB:-character_sheet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]          # opt-in: `docker compose --profile tools up pgadmin`
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # Playwright e2e runner (opt-in: `docker compose --profile e2e run e2e`, or
  # `npm run e2e`). Pinned image so browsers match the @playwright/test version.
  # E2E_BASE_URL derives from FRONTEND_PORT, so the main checkout (5173) and each
  # worktree slot (5183, …) run the same command with no hardcoded port. Mounts
  # the frontend workspace so specs/config edits are live; its own node_modules
  # volume keeps the install off the host tree.
  #
  # This is the ONE container the dev loop keeps (#1458): the visual baselines are
  # `*-linux.png` and the fonts are pinned to this image, so running Playwright on
  # a mac host would invalidate every one of them. Start the dev servers yourself
  # first — the app no longer has a container to depend on.
  #
  # host.docker.internal, NOT host networking. `network_mode: host` puts the
  # container in the Linux VM's namespace on Docker Desktop, where a dev server
  # running on the mac host simply is not bound — measured: host networking gets
  # a connection failure, host.docker.internal gets 200. It worked before only
  # because the thing it dialled was itself a container. The host-gateway alias
  # keeps this working on native Linux, where the name is not built in.
  e2e:
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    profiles: ["e2e"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      E2E_BASE_URL: ${E2E_BASE_URL:-http://host.docker.internal:${FRONTEND_PORT:-5173}}
    working_dir: /app/frontend
    volumes:
      - .:/app
      - e2e_node_modules:/app/node_modules
      - e2e_ws_node_modules:/app/frontend/node_modules
    # Workspace install from the repo root (links packages/*, #820), then run
    # the suite from the frontend workspace.
    command: sh -c "cd /app && npm install --workspace frontend --no-package-lock && cd /app/frontend && npx playwright test"

volumes:
  e2e_node_modules:
  e2e_ws_node_modules:
  postgres_data:
  pgadmin_data:
